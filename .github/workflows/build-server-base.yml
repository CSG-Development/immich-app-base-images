name: Build and Push Server Base Images

on:
  workflow_dispatch:
  push:
    branches: [main, move-to-dhi]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-server:
    name: Build Server Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DHI
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate timestamp
        id: ts
        run: echo "timestamp=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build and push base-server-dev
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          target: dev
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/base-server-dev:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/base-server-dev:${{ steps.ts.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push base-server-prod
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/base-server-prod:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/base-server-prod:${{ steps.ts.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
